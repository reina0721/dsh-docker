name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Test cross-platform crates
        run: cargo test -p dsh-config -p dsh-auth -p dshctl --locked
      - name: Build CLI
        run: cargo build --release --locked -p dshctl

  macos:
    name: Rust (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked

  supply-chain:
    name: Supply chain / scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Actionlint
        uses: raven-actions/actionlint@v2
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: cargo-audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  container:
    name: Container config / slim build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose config
        run: docker compose -f compose.yaml -f compose.build.yaml config >/dev/null
      - uses: docker/setup-buildx-action@v3
      - name: Build slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: dsh-docker:ci-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Entrypoint smoke
        run: docker run --rm dsh-docker:ci-slim dsh-entrypoint version
