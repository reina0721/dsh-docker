[workspace]
members = [
    "crates/dsh-config",
    "crates/dsh-auth",
    "crates/dsh-gateway",
    "crates/dshctl",
]
resolver = "2"

[workspace.package]
version = "2.0.6"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reina0721/dsh-docker"
publish = false

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bcrypt = "0.17"
bytes = "1.10"
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
flate2 = "1.1"
futures-util = "0.3"
getrandom = "0.2"
hex = "0.4"
http = "1.3"
http-body-util = "0.1.3"
hyper = { version = "1.6", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.14", features = ["tokio", "client-legacy", "http1"] }
nix = { version = "0.29", features = ["signal", "process", "user", "fs"] }
rpassword = "7.3"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tar = "0.4"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.46", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "process",
    "fs",
    "time",
    "io-util",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "2.12", features = ["json"] }
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
